plugins { id 'com.android.application' }

android {
    namespace 'com.lightningmonitor'
    compileSdk 35
    defaultConfig {
        applicationId 'com.lightningmonitor'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
